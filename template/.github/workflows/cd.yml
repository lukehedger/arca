name: <workflow-prefix>cd

on:
  push:
    branches: [main]
    # if: greenfield
    paths-ignore:
      - "**/*.md"
    # if: migration
    paths:
      - "<app-dir>/**"
      - "!<app-dir>/**/*.md"
      - ".github/workflows/<app-dir>-*.yml"
    # end
  workflow_dispatch:

concurrency:
  group: <workflow-prefix>cd
  cancel-in-progress: false

permissions: {}

jobs:
  dev:
    uses: ./.github/workflows/<workflow-prefix>deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev

  acc:
    needs: dev
    uses: ./.github/workflows/<workflow-prefix>deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: acc

  prod:
    needs: acc
    uses: ./.github/workflows/<workflow-prefix>deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: prod
