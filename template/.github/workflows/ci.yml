name: <workflow-prefix>ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # if: migration
    paths:
      - "<app-dir>/**"
      - ".github/workflows/<app-dir>-*.yml"
    # end
  workflow_dispatch:

permissions: {}

defaults:
  run:
    working-directory: <app-root>

jobs:
  verify:
    name: verify
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: <app-root>/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format
        run: bunx biome ci

      - name: Type check
        run: bun types

      - name: Fitness functions
        run: bun fitness

      - name: Unit tests
        run: bun test:unit

      - name: Mutation tests
        run: bun mutation

  # The ephemeral GitHub environment holds AWS_REGION and AWS_DEPLOY_ROLE_ARN for an account that is not production.
  integration:
    name: integration
    needs: verify
    timeout-minutes: 45
    runs-on: ubuntu-latest
    environment: ephemeral
    permissions:
      contents: read
      id-token: write
    # A second push to the pull request waits, so two runs never deploy the same stack at once.
    concurrency:
      group: <workflow-prefix>ephemeral-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    env:
      ENVIRONMENT_NAME: pr-${{ github.event.pull_request.number || github.run_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: <app-root>/package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-actions-${{ env.ENVIRONMENT_NAME }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}

      - name: Deploy disposable environment
        run: bun env:deploy

      - name: Integration tests
        run: bun env:test

      # Runs after a failure or a cancellation too, so no disposable environment outlives its run.
      - name: Destroy disposable environment
        if: always()
        run: bun env:destroy
